<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOS-Jarvis Dashboard — {% block title %}{% endblock %}</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; margin: 0; padding: 0; }
  nav { background: #16213e; padding: 0.75rem 1.5rem; display: flex; gap: 1.5rem; align-items: center; }
  nav a { color: #a8d8ea; text-decoration: none; font-size: 0.9rem; }
  nav a:hover { color: #ffffff; }
  nav .brand { color: #00d4aa; font-weight: bold; margin-right: 1rem; }
  .badge-valid { color: #00d4aa; }
  .badge-invalid { color: #ff6b6b; }
  .badge-allow { color: #00d4aa; }
  .badge-deny { color: #ff6b6b; }
  .badge-block { color: #ff6b6b; }
  .badge-t0 { color: #00d4aa; }
  .badge-t1 { color: #ffd93d; }
  .badge-t2 { color: #ff9a3c; }
  .badge-t3 { color: #ff6b6b; }
  main { padding: 1.5rem; }
  h1 { color: #a8d8ea; margin-bottom: 1rem; font-size: 1.3rem; }
  h2 { color: #7ec8e3; font-size: 1rem; margin: 1rem 0 0.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { background: #16213e; color: #a8d8ea; padding: 0.4rem 0.6rem; text-align: left; }
  td { padding: 0.35rem 0.6rem; border-bottom: 1px solid #2a2a4a; vertical-align: top; word-break: break-word; max-width: 300px; }
  tr:hover td { background: #1e1e3f; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 0.25rem 0.75rem; font-size: 0.85rem; }
  .kv .label { color: #7ec8e3; }
  .note { color: #888; font-size: 0.8rem; margin-top: 0.5rem; }
  .empty { color: #666; font-style: italic; padding: 0.5rem 0; }
</style>
</head>
<body>
<nav>
  <span class="brand">AOS-Jarvis</span>
  <a href="/">Overview</a>
  <a href="/audit">Audit</a>
  <a href="/permissions">Permissions</a>
  <a href="/activity">Activity</a>
  <a href="/snapshots">Snapshots</a>
  <a href="/model">Model</a>
  <a href="/security">Security</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
