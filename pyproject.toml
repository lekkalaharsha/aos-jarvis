[project]
name = "aos-jarvis"
version = "0.0.1"
description = "AOS-Jarvis Phase 0 foundation: CLI, audit log, risk model, tool contract."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["fastapi>=0.100", "uvicorn>=0.20", "jinja2>=3"]
voice = ["sounddevice>=0.4", "faster-whisper>=1.0"]
browser = ["playwright==1.61.0"]

[project.scripts]
aos = "aos.interfaces.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aos*"]

[tool.setuptools.package-data]
"aos.dashboard" = ["templates/*.html"]
